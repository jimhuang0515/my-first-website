services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: stockdev
      POSTGRES_PASSWORD: stockdev
      POSTGRES_DB: stockdev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - stock-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockdev -d stockdev"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  stock-data:
