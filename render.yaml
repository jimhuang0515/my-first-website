services:
  - type: web
    name: taiwan-stock-lab
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taiwan-stock-db
          property: connectionString
      - key: STOCK_DATA_MODE
        value: live
      - key: COOKIE_SECURE
        value: "true"
      - key: STOCK_AI_MODEL
        value: gpt-4.1-mini
databases:
  - name: taiwan-stock-db
    plan: free
    region: singapore
    databaseName: stocklab
    user: stocklab
    postgresMajorVersion: "17"
    ipAllowList: []
